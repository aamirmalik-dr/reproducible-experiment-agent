[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reproducible-experiment-agent"
version = "0.2.0"
description = "Experiment-planning agent for tabular ML with a trial allowlist, trusted splits, leakage traps, frozen candidates and one-shot holdout scoring."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aamir Malik" }]
keywords = ["llm-agents", "mlops", "experiment-tracking", "reproducibility", "scikit-learn"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "ruff>=0.5"]

[project.scripts]
reproducible-experiment-agent = "reproducible_experiment_agent.__main__:main"

[project.urls]
Repository = "https://github.com/aamirmalik-dr/reproducible-experiment-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
