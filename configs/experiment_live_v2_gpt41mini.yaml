# v2 live run A: held-out v2 family (10 tasks from 5 generators never used before),
# two runs, all four arms, same model as v1. Pre-registered in the v2 plan and
# frozen 2026-11-09 before the run. v1 configs and outputs are unchanged.
mode: live
model: openai/gpt-4.1-mini          # via OpenRouter; overrides AGENT_MODEL_NAME
families: [heldout_v2]
arms: [fixed, random_search, single_call, agent]
runs: 2
isolation: subprocess
episode:
  max_trials: 6
  compute_seconds: 180
  trial_time_limit_s: 60
  max_steps: 18
  max_tool_calls: 14
  max_tokens: 60000
  max_wall_seconds: 900
  recent_k: 4
  max_completion_tokens: 900
run_caps:
  max_total_tokens: 2000000
  max_usd: 0.35                     # spend so far plus the largest episode cost seen, per arm
  usd_per_mtok_input: 0.40          # OpenRouter listed price, 2026-11-09
  usd_per_mtok_output: 1.60
output_dir: reports/live_v2_gpt-4.1-mini
work_dir: runs/v2a
